# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g base-index 1
set -g pane-base-index 1

set-option -g prefix C-s
set-option -g prefix2 none

set -g set-clipboard on

set -g extended-keys on
set -g extended-keys-format csi-u

set-option -g set-titles on
set-option -g set-titles-string "#{pane_title}"

set-option -g update-environment "SSH_AUTH_SOCK"
setenv -g SSH_AUTH_SOCK $HOME/.ssh/ssh_auth_sock

unbind r
bind r source-file ~/.config/tmux/tmux.conf

unbind v
bind v copy-mode

bind -r j resize-pane -D 3
bind -r k resize-pane -U 3
bind -r l resize-pane -R 3
bind -r h resize-pane -L 3

# mouse support
set -g mouse on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

# <M+shift+h/l>
bind-key -n M-H previous-window
bind-key -n M-L next-window

# move windows using <M+num>
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

# bind-key -r f run-shell "tmux neww ~/scripts/tmux-sessionizer"
bind-key n command-prompt "new-session -s '%%'"

unbind -T copy-mode-vi MouseDragEnd1Pane

# tmux plugin manager
set-environment -g TMUX_PLUGIN_MANAGER_PATH ~/.tmux/plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically save sessions every 15 mins

set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-battery'

# set -g @plugin 'catppuccin/tmux#v2.3.0'

set -g @sessionx-bind 'o'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Configure Online
set -g @online_icon "ok"
set -g @offline_icon "nok"

# Style

# Gruvbox (warm hex) - matches Ghostty "Gruvbox Dark Hard" + gruvbox.nvim
BAR_BG="#3c3836"          # col_bg1
BAR_FG="#ebdbb2"          # col_fg1

SESSION_BG="#665c54"      # col_bg3
SESSION_FG="#bdae93"      # col_fg3

WIN_BG="#504945"          # inactive window, col_bg2
WIN_FG="#ebdbb2"          # col_fg1
WIN_ACTIVE_BG="#fabd2f"   # active window, col_yellow2
WIN_ACTIVE_FG="#3c3836"   # col_bg1

USER_BG="#928374"         # col_gray1
USER_FG="#282828"

HOST_BG="#689d6a"         # neutral_aqua
HOST_FG="#282828"

# Powerline separators
ARROW_R="#(printf '\uE0B0')"       # right-pointing
ARROW_R_THIN="#(printf '\uE0B1')"  # right-pointing, thin
ARROW_L="#(printf '\uE0B2')"       # left-pointing

# Status bar
set-option -g status-position top

set-option -g status-style bg=${BAR_BG},fg=${BAR_FG}

set-option -g status-justify absolute-centre

set-option -g status-left "\
#[bg=${SESSION_BG},fg=${SESSION_FG}] #S \
#[bg=default,fg=${SESSION_BG}]${ARROW_R}\
"

set-option -g status-right "\
#[bg=${BAR_BG},fg=${USER_BG}]${ARROW_L}\
#[bg=${USER_BG},fg=${USER_FG}] #(whoami) \
#[bg=${HOST_BG},fg=${HOST_FG}] #h \
"

set -g status-left-length 100
set -g status-right-length 100

set-option -g window-status-format "\
#[bg=${WIN_BG},fg=${BAR_BG},noitalics,nounderscore]${ARROW_R}\
#[bg=${WIN_BG},fg=${WIN_FG}] #I ${ARROW_R_THIN}\
#[bg=${WIN_BG},fg=${WIN_FG}] #W \
#{?window_end_flag,#[bg=default],#[bg=${BAR_BG}]}\
#[fg=${WIN_BG},noitalics,nounderscore]${ARROW_R}\
"

set-option -g window-status-current-format "\
#[bg=${WIN_ACTIVE_BG},fg=${BAR_BG},nobold,noitalics,nounderscore]${ARROW_R}\
#[bg=${WIN_ACTIVE_BG},fg=${WIN_BG}] #I ${ARROW_R_THIN}\
#[bg=${WIN_ACTIVE_BG},fg=${WIN_BG},bold] #W#{?window_zoomed_flag,*Z,} \
#{?window_end_flag,#[bg=default],#[bg=${BAR_BG}]}\
#[fg=${WIN_ACTIVE_BG},nobold,noitalics,nounderscore]${ARROW_R}\
"

set-option -g window-status-separator ""

run '~/.tmux/plugins/tpm/tpm'
